  <style>
#bootsplash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#fff;transition:opacity .2s ease}
#bootsplash img{width:30vmin;max-width:160px;min-width:96px;height:auto;border-radius:22%;animation:splashPulse 1.4s ease-in-out infinite}
#bootsplash.off{opacity:0;pointer-events:none}
:root{
  --bg:#f3f6f4; --card:#fff; --ink:#15231b; --mut:#6b7a71; --line:#dfe7e2;
  --brand:#166534; --brand2:#14532d; --brand-ink:#fff; --soft:#e8f3ec;
  --danger:#b42318; --warn:#b45309; --ok:#15803d;
  --fs:1; --r:14px; --sh:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1511;--card:#17211b;--ink:#e8f0eb;--mut:#93a39a;--line:#2a372f;--brand:#22a455;--brand2:#0f2a1a;--soft:#1d2d24;--danger:#f97066;--warn:#fbbf24;--ok:#4ade80;--sh:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:calc(16px*var(--fs))/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h2{font-size:calc(20px*var(--fs));margin:0}
h3{margin:0 0 10px}
h4{margin:0 0 8px;font-size:calc(15px*var(--fs))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.top{position:sticky;top:0;z-index:20;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center}
body.stale #view{pointer-events:none;opacity:.55;transition:opacity .25s}
.logo{box-sizing:border-box;width:68px;height:55px;padding:11px 8px;overflow:visible;flex:none;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.logo path{fill:#f5fe00;stroke:var(--logo-stroke,#14532d);stroke-width:3;stroke-linejoin:round;paint-order:stroke}
.t1{font-weight:700;font-size:calc(17px*var(--fs));line-height:1.1}
.t2{font-size:calc(12px*var(--fs));opacity:.75}
.sync{border:0;border-radius:99px;padding:5px 11px;font-size:calc(12px*var(--fs));font-weight:600;background:rgba(255,255,255,.16);color:#fff}
.sync.busy{background:#b45309}
.sync.err{background:#b42318}
main{max-width:760px;margin:0 auto;padding:12px 12px 0}
.loader,.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:0 0 12px;border:1px solid var(--line)}
.card.err{color:var(--danger)}
.bar{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.sm{padding:7px 12px;min-height:36px;font-size:calc(14px*var(--fs))}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger,.btn.ghost.danger{color:var(--danger)}
.btn.block{width:100%}
.inp,select.inp{width:100%;max-width:100%;box-sizing:border-box;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-height:44px}
.lbl{display:block;font-size:calc(13px*var(--fs));color:var(--mut);margin:0 0 6px}
.hint{font-size:calc(13px*var(--fs));color:var(--mut);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:calc(13px*var(--fs));background:var(--c,#888);color:var(--ct,#fff)}
.badge{font-size:calc(12px*var(--fs));padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mut);font-weight:600;white-space:nowrap}
.badge.live{background:#fde68a;color:#78350f}
.game{cursor:pointer}
.gdate{font-weight:700;font-size:calc(17px*var(--fs))}
.gline{font-size:calc(15px*var(--fs));margin-top:2px}
.navb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:8px 2px;color:var(--mut);font-size:calc(11.5px*min(var(--fs),1.05));flex:1 1 0;min-width:0;white-space:nowrap}
.navb .i{font-size:calc(20px*var(--fs));position:relative}
.ldot{position:absolute;top:0;right:-7px;width:9px;height:9px;border-radius:50%;background:#e53935;box-shadow:0 0 0 2px var(--card);animation:ldot 1.6s ease-in-out infinite}
@keyframes ldot{50%{opacity:.35}}
.navb.on{color:var(--brand);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;font-size:calc(14px*var(--fs))}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* таблиці */
.tw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fs));font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:calc(12px*var(--fs));color:var(--mut);font-weight:600}
.tbl .l{text-align:left}
.tbl tr.lead td{background:var(--soft);font-weight:700}
.tbl tr.clk{cursor:pointer}
.tbl tr.detail td{text-align:left;white-space:normal;background:var(--soft);font-size:calc(13px*var(--fs))}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.barv{height:6px;border-radius:3px;background:var(--brand);min-width:2px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:calc(20px*var(--fs))}
.kpi span{font-size:calc(11px*var(--fs));color:var(--mut)}
/* табло */
.stick{position:sticky;top:58px;z-index:10;margin:0 -12px 10px;padding:6px 12px;background:var(--bg)}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch}
.side{background:var(--c);color:var(--ct,#fff);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--sh)}
.side .tn{font-size:calc(14px*var(--fs));font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sc{font-size:calc(54px*var(--fs));line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:64px;gap:2px}
.mid .colon{font-size:calc(28px*var(--fs));font-weight:800;color:var(--mut)}
.timer{font-size:calc(20px*var(--fs));font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--danger)}
.lim{font-size:calc(11px*var(--fs));color:var(--mut);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gh{display:flex;align-items:center;gap:8px;font-weight:700;margin:0 0 8px}
.pbtn{position:relative;min-height:54px;border-radius:12px;border:2px solid var(--c);background:var(--card);font-weight:600;font-size:calc(15px*var(--fs));padding:6px 4px;overflow-wrap:anywhere;line-height:1.15;transition:transform .08s}
.pbtn:active{transform:scale(.94);background:var(--c);color:var(--ct,#fff)}
.pbtn.own{border-style:dashed;border-color:var(--danger)}
.pbtn .cnt{position:absolute;top:-7px;right:-5px;background:var(--c);color:var(--ct,#fff);border-radius:99px;min-width:22px;height:22px;font-size:calc(12px*var(--fs));line-height:22px;font-weight:700}
.pbtn .ag{position:absolute;bottom:-7px;right:-5px;background:var(--danger);color:#fff;border-radius:99px;padding:0 6px;font-size:calc(11px*var(--fs));line-height:18px}
.own-toggle{width:100%;margin:0 0 10px;padding:9px;border-radius:12px;border:1px dashed var(--danger);background:transparent;color:var(--danger);font-weight:600}
.own-toggle.on{background:var(--danger);color:#fff}
.aud{padding:8px 0;border-bottom:1px solid var(--line)}
.aud:last-child{border:0}
.aud .at{display:flex;gap:8px;align-items:center;font-size:calc(12px*var(--fs));flex-wrap:wrap}
.aud .ai{font-size:calc(15px*var(--fs))}
.aud .ad{font-size:calc(14px*var(--fs));margin:2px 0;word-break:break-word}
.aud .aw{font-size:calc(12px*var(--fs));color:var(--mut)}
.aud.bad .ad{color:var(--danger);font-weight:600}
.audlist{max-height:60vh;overflow-y:auto}
.glog{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.glog:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.x{border:0;background:none;color:var(--danger);font-size:calc(18px*var(--fs));padding:4px 8px}
.mrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:nowrap}
.mrow .macts{display:flex;gap:6px;flex:none}
.mrow .chev{color:var(--mut);font-size:calc(22px*var(--fs));flex:none;line-height:1}
.mrow .mt{overflow-wrap:anywhere}
.mv{border:2px solid var(--c);border-radius:12px;padding:8px 10px;margin:8px 0}
.mvg{margin:10px 0}
.shbtns{flex-wrap:nowrap;gap:8px}
.shbtns .btn{background:#fff;flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px;white-space:nowrap}
.mrow:last-child{border:0}
.mn{color:var(--mut);width:26px}
.sc2{font-weight:800;font-variant-numeric:tabular-nums}
.sub{font-size:calc(12px*var(--fs));color:var(--mut)}
/* вибір складу */
.tchip{border:2px solid var(--c);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600}
.tchip.on{background:var(--c);color:var(--ct,#fff)}
.brush{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.brush .tchip{padding:8px 12px}
.brush .tchip.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.pchip{border:3px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;min-height:46px;font-weight:600;font-size:calc(14px*var(--fs));overflow-wrap:anywhere;line-height:1.15}
.pchip.on{background:var(--c);color:var(--ct,#fff);border-color:var(--c)}
.pchip.taken{background:var(--c);color:var(--ct,#fff);border-color:var(--c);opacity:.38}
.pchip.long,.pbtn.long{font-size:calc(12px*var(--fs));overflow-wrap:normal;letter-spacing:-.2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .tab.on{background:var(--brand)}
.foot{padding:14px 0 6px}
/* довідники */
.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border:0}
.li.off{opacity:.55}
.ibtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:calc(14px*var(--fs));min-height:36px}
/* модалка / тост */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow:auto;padding-bottom:max(18px,env(safe-area-inset-bottom))}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet .row{margin-top:14px;justify-content:flex-end}
.sum{font-size:calc(34px*var(--fs));font-weight:800;text-align:center;margin:6px 0}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;pointer-events:none}
.toast{background:#111;color:#fff;border-radius:12px;padding:10px 16px;font-size:calc(14px*var(--fs));max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.ctx{font-size:calc(13px*var(--fs));color:var(--mut);padding:8px 12px}
.dots{display:flex;gap:3px;justify-content:center;margin-top:3px;min-height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.best{background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:calc(15px*var(--fs))}
.timer.paused{color:var(--warn)}
.mute{border:0;background:transparent;font-size:calc(16px*var(--fs));padding:2px 6px;line-height:1;opacity:.75}
.tlink{border:0;background:transparent;color:#9ec5ff;font-weight:700;text-decoration:underline;padding:0 0 0 8px;pointer-events:auto}
#toast .toast{pointer-events:auto}
.logo-img{box-sizing:border-box;width:68px;height:55px;padding:6px;flex:none;background:#fff;border-radius:50%;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sheet .tbl{font-size:calc(13px*var(--fs))}
.pbtn.agbtn{border-style:dashed;border-color:var(--c);color:var(--ink)}
.pbtn.agbtn .cnt{background:var(--c);color:var(--ct,#fff)}
.pbtn .lnb{position:absolute;top:-7px;left:-5px;background:var(--ink);color:var(--card);border-radius:99px;font-size:calc(11px*var(--fs));line-height:18px;padding:0 5px}
textarea.inp{min-height:280px;font:calc(14px*var(--fs))/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;white-space:pre-wrap}
.crown{position:absolute;top:-9px;left:-4px;font-size:calc(15px*var(--fs));line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pchip,.pbtn{position:relative}
.pchip .rt{display:block;font-size:calc(10px*var(--fs));font-weight:700;opacity:.7;margin-top:1px}
.ibtn.rate{min-width:68px;background:var(--card);color:var(--ink)}
@media print{
  .top,.nav,.toolbar,.tabs,#toast,#modal,.foot,.btn,.ibtn{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .stick{position:static}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .tw{overflow:visible}
  select.inp{border:0;appearance:none;-webkit-appearance:none;padding:0}
}
textarea.bugta{min-height:120px;font:inherit;font-size:calc(15px*var(--fs));white-space:pre-wrap;margin-top:10px}
.aud.bad2 .ad{font-weight:600}
</style>
<style>
.dbtn{display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;font-weight:600}
.dbtn .dic{opacity:.7}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:calc(17px*var(--fs))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .cw{font-size:calc(12px*var(--fs));color:var(--mut);padding:4px 0}
.cal .cd{min-height:40px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:calc(16px*var(--fs));color:var(--ink)}
.cal .cd.tod{border-color:var(--brand)}
.cal .cd.sel{background:var(--brand);color:#fff;font-weight:700}
/* v0.35: картка гравця, налаштування клубу */
.hero{display:flex;gap:14px;align-items:center}
.av{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:calc(26px*var(--fs));font-weight:800;color:var(--brand-ink,#fff);background:var(--brand);flex:none;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--brand)}
.hero h2{font-size:calc(24px*var(--fs));line-height:1.1}
.aw .badge{background:var(--soft);color:var(--ink);font-size:calc(12.5px*var(--fs));padding:5px 10px}
.aw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fbars{display:flex;align-items:flex-end;gap:6px;height:96px;margin:6px 0 4px}
.fbars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.fbars .b i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--brand);min-height:3px}
.fbars .b em{font-style:normal;font-size:calc(11px*var(--fs));font-weight:700}
.fres{display:flex;gap:6px}
.fres span{flex:1;text-align:center;font-size:calc(11px*var(--fs));font-weight:700;border-radius:6px;padding:2px 0;color:#fff}
.fres .W{background:#2e9e4f}.fres .D{background:#8a98a0}.fres .L{background:#d64545}
.rec{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rec div{background:var(--soft);border-radius:12px;padding:10px 12px}
.rec b{display:block;font-size:calc(20px*var(--fs))}.rec span{font-size:calc(12px*var(--fs));color:var(--mut)}
.pbar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.pbar.bad i{background:var(--danger)}
.cmp{width:100%;border-collapse:collapse;font-size:calc(15px*var(--fs))}
.cmp td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.cmp td:first-child{text-align:left;color:var(--mut);font-size:calc(13px*var(--fs))}
.cmp .win{font-weight:800;color:var(--ok,#15803d)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.sw button{width:50px;height:50px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);background:var(--c);position:relative}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.sw button.on::after{content:"✓";color:#fff;font-weight:800;position:absolute;inset:0;display:grid;place-items:center}
.swl{display:flex;flex-wrap:wrap;gap:12px}
.swl .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:calc(12px*var(--fs));color:var(--mut)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:calc(20px*var(--fs));font-weight:700}
.step b{min-width:64px;text-align:center;font-size:calc(17px*var(--fs))}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow .tx{flex:1;min-width:0}.setrow .tx small{display:block;color:var(--mut);font-size:calc(12.5px*var(--fs))}
.tg{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.2s}
.tg.on{background:var(--brand)}.tg.on::after{left:25px}
.pv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pvg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.savebar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);margin-top:6px}
.adm{font-size:calc(11px*var(--fs));font-weight:700;background:#fde68a;color:#78350f;border-radius:99px;padding:2px 8px;vertical-align:middle}
.lockn{font-size:calc(12px*var(--fs));color:var(--mut);margin-top:6px}
.gstep{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.gstep:last-child{border:0}
.gstep .step button{width:36px;height:36px}.gstep .step b{min-width:28px}
.rscore{font-size:calc(34px*var(--fs));font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.retro-badge{font-size:calc(11px*var(--fs));font-weight:700;background:var(--soft);color:var(--mut);border-radius:99px;padding:2px 8px}

.loader.splash{padding:0;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.splash .mark{width:112px;height:112px;border-radius:26px;background:#14532d;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.18);animation:splashPulse 1.4s ease-in-out infinite}
.splash .splash-logo{width:76px;height:auto}
.splash-t{font-weight:700;font-size:calc(18px*var(--fs));color:var(--txt,#111)}
.splash-s{font-size:calc(13px*var(--fs));color:var(--mut)}
@keyframes splashPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.8}}
</style>

</head>

/** Хто грає далі.
 *  Переможець лишається, переможений сідає. Нічия:
 *   • перший матч дня: 0:0 → лишається переможець пенальті; інакше — та, що забила першою;
 *   • 3 команди: сідає та, що вже була на полі (захисник), лишається та, що вийшла з лавки;
 *   • 4 і більше команд: сідає та, що зіграла більше матчів за день.

  fin.forEach(function (m) { last[m.teamAId] = last[m.teamBId] = m.seq; played[m.teamAId]++; played[m.teamBId]++; });
  var prev = fin[fin.length - 1];
  if (!prev) return { a: tids[0], b: tids[1], why: 'Перший матч дня.' };
  var r = result(prev), A = prev.teamAId, B = prev.teamBId, stay = null, why = '';
  var other = function (t) { return t === A ? B : A; };
  if (r.w) { stay = r.w; why = 'Переміг ' + teamName(r.w) + ' — залишається; ' + teamName(r.l) + ' сідає на лавку.'; }
  else {
    var fs = goalsOfMatch(prev.id)[0], fsTeam = fs ? fs.teamId : null;
    if (prev.penWinner) { stay = prev.penWinner; why = 'Нічия 0:0, пенальті виграла ' + teamName(stay) + ' — вона залишається; ' + teamName(other(stay)) + ' сідає.'; }
    else if (fin.length === 1) { if (fsTeam) { stay = fsTeam; why = 'Нічия в першому матчі дня — залишається ' + teamName(fsTeam) + ' (забила першою).'; } }
    else {
      if (tids.length === 3) {
        var before = fin[fin.length - 2], inBefore = function (t) { return t === before.teamAId || t === before.teamBId; };
        var def = inBefore(A) && !inBefore(B) ? A : (inBefore(B) && !inBefore(A) ? B : null);
        if (def) { stay = other(def); why = 'Нічия — сідає ' + teamName(def) + ' (вже була на полі), залишається ' + teamName(stay) + ' (вийшла з лавки).'; }
      }
      if (!stay && played[A] !== played[B]) { var sit = played[A] > played[B] ? A : B; stay = other(sit); why = 'Нічия — сідає ' + teamName(sit) + ' (грала більше).'; }
      if (!stay && fsTeam) { stay = fsTeam; why = 'Нічия, правило рівне — залишається ' + teamName(fsTeam) + ' (забила першою).'; }
    }
  }

  if (stay && bench.length) return { a: stay, b: bench[0], why: why + ' Виходить ' + teamName(bench[0]) + '.' };
  var order = tids.slice().sort(function (x, y) { return (last[x] - last[y]) || (tids.indexOf(x) - tids.indexOf(y)); });

}

function gameScorers(g, tids) {

/** v0.38: асист — необовʼязковий; питаємо, хто віддав гольовий пас (будь-хто зі складу команди, крім автора гола). */

/** Скасування щойно записаного гола (режим без підтвердження). Якщо цей гол завершив матч — матч відновлюється. */
function undoGoal(id) {

/** «Поділитися»: напряму (navigator.share) → через сторінку-обгортку ярлика (у вкладеному вікні Google системне меню недоступне) → копіювання. */
var shareAck = false;
window.addEventListener('message', function (e) {
  if (!e.data) return;
  if (e.data.afk === 'share-ack') shareAck = true;

});
function shareText(text) {
  var viaWrapper = function () {
    shareAck = false;
    try { window.top.postMessage({ afk: 'share', text: text }, '*'); } catch (e) { }
    setTimeout(function () { if (!shareAck) { copyText(text); toast('Меню «Поділитися» тут недоступне — текст скопійовано, вставте його в чат', 4000); } }, 1200);
  };
  try {
    if (navigator.share) { navigator.share({ text: text }).catch(function (e) { if (!(e && e.name === 'AbortError')) viaWrapper(); }); return; }
  } catch (e) { }
  viaWrapper();
}
function copyText(text) {
  var ta = $('#sharetext'), ok = false;
  try { if (ta) { ta.focus(); ta.select(); ta.setSelectionRange(0, 99999); ok = document.execCommand('copy'); } } catch (e) { ok = false; }
  if (ok) return toast('Скопійовано');

}

function showBootError(e) {
  if (DB.loaded) return;
  $('#view').innerHTML = '<div class="card err">Не вдалося завантажити дані: ' + esc(errMsg(e)) + '<br><br><button class="btn" data-act="retryBoot">Повторити</button></div>';
}
// авто-оновлення, коли ніхто нічого не редагує (щоб бачити зміни інших на списку ігор / екрані гри)
setInterval(function () {
  if (!DB.loaded || Q.inflight || Q.pending.length || UI.draft || modalResolve) return;
  if (UI.gameId || UI.tab === 'games' || UI.tab === 'cur') reload(true);
}, 20000);
boot();
})();
</script>
